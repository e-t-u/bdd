[workspace]
members = [
    ".",
    "crates/bdd-small-floats",
    "crates/bdd-mcp",
    "web",
    "contrib/rust/bdd-netlink",
]

[package]
name = "bdd"
version = "0.5.4"
edition = "2021"
description = "Command line tool to interpret, manipulate, merge and create bit streams"
authors = ["Esa Turtiainen"]
license = "GPL-3.0"
repository = "https://github.com/e-t-u/bdd"
homepage = "https://github.com/e-t-u/bdd"
documentation = "https://github.com/e-t-u/bdd#readme"
readme = "README.md"
keywords = ["bitstream", "binary", "slicer", "transcoder", "parser"]
categories = ["command-line-utilities", "parsing", "encoding"]
exclude = [
    "docs/Presentation.odp",
    "docs/Presentation.pdf",
    "legacy/*",
    "dist/*",
]

[lib]
name = "bdd"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap_complete = "4.5"
tempfile = "3.10"
libc = "0.2"
memmap2 = { version = "0.9", optional = true }
bdd-small-floats = { path = "crates/bdd-small-floats", version = "0.5.4", optional = true }

[features]
default = ["small-floats", "mmap", "probe"]
mmap = ["dep:memmap2"]
small-floats = ["dep:bdd-small-floats"]
small-float = ["small-floats"]
probe = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bench]]
name = "throughput"
harness = false

[patch.crates-io]
bdd-small-floats = { path = "crates/bdd-small-floats" }
