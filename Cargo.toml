[package]
name = "bdd"
version = "0.3.0"
edition = "2021"
description = "Command line tool to interpret, manipulate, merge and create bit streams"
authors = ["Esa Turtiainen"]
license = "GPL-3.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
csv = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
