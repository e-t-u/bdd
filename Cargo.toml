[package]
name = "bdd"
version = "0.5.1"
edition = "2021"
description = "Command line tool to interpret, manipulate, merge and create bit streams"
authors = ["Esa Turtiainen"]
license = "GPL-3.0"

[lib]
name = "bdd"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["server", "small-floats"]
server = []
serve = ["server"]
web = ["server"]
small-floats = []
small-float = ["small-floats"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bench]]
name = "throughput"
harness = false
