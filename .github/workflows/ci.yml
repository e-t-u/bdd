name: CI

on:
  push:
    branches: [ master, rust-bdd, main ]
  pull_request:
    branches: [ master, rust-bdd, main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Format Check
        run: cargo fmt --check
      - name: Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: |
          cargo build --all-targets --all-features
          ln -sf target/debug/bdd ./bdd
      - name: Run Tests
        run: cargo test --all-targets --all-features

  package:
    name: Package (DEB, RPM, C Library, Python)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install Packaging Dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build Packages
        run: ./package/build_all.sh
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bdd-distribution-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.whl
            dist/*.crate
            dist/SHA256SUMS
